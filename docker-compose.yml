version: '3.8'

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: idlescholar
    ports:
      - "5432:5432"
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data
	test: ["CMD-SHELL", "pg_isready -U postgres -d idlescholar"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s


  server:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: idlescholar
    ports:
      - "8080:8080"
      - "50051:50051"
    depends_on:
      db:
	    condition: service_healthy
	restart: on-failure 

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  pgdata: