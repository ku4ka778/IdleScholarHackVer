name: idlescholar
description: "."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  grpc: ^4.0.0
  protobuf: ^5.0.0
  cupertino_icons: ^1.0.8
  window_manager: ^0.4.3
  fixnum: ^1.1.0
  tray_manager: ^0.5.2
  http: ^1.1.0
  flutter_screenutil: ^5.9.3
  flutter_max_miniapp:
    git:
      url: https://github.com/serezhia/flutter_max_miniapp.git
      ref: main

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  window_manager: ^0.4.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/backgrounds/
    - assets/characters/
    - assets/monsters/
    - assets/app_icon.ico

  fonts:
    - family: Neucha
      fonts:
        - asset: assets/fonts/Neucha-Regular.ttf
