syntax = "proto3";

package craft;

option go_package = "IdleScholar_BD/gen/craft;craftpb";

service CraftService {
  rpc GetRecipes (GetRecipesRequest) returns (GetRecipesResponse);
  rpc CraftItem (CraftItemRequest) returns (CraftItemResponse);
  rpc GetSalvageableItems (GetSalvageableItemsRequest) returns (GetSalvageableItemsResponse);
  rpc SalvageItem (SalvageItemRequest) returns (SalvageItemResponse);
}

message GetRecipesRequest {
  int32 character_id = 1;
}

message GetRecipesResponse {
  bool success = 1;
  string message = 2;
  repeated Recipe recipes = 3;
}

message Recipe {
  int32 id = 1;
  string code = 2;
  string result_code = 3;
  string result_name = 4;
  int32 result_quantity = 5;
  repeated Ingredient ingredients = 6;
  bool can_craft = 7;
  string result_slot = 8;
  int32 result_attack = 9;
  int32 result_defense = 10;
  int32 result_luck = 11;
	int64 gold_cost = 12;
}

message Ingredient {
  string resource_type = 1;
  int32 amount = 2;
  int64 available = 3;
}

message CraftItemRequest {
  int32 character_id = 1;
  int32 recipe_id = 2;
	int32 amount = 3;
}

message CraftItemResponse {
  bool success = 1;
  string message = 2;
}

message GetSalvageableItemsRequest {
  int32 character_id = 1;
}

message GetSalvageableItemsResponse {
  bool success = 1;
  string message = 2;
  repeated SalvageableItem items = 3;
}

message SalvageableItem {
  int32 id = 1;
  string code = 2;
  string name = 3;
  string slot = 4;
  int32 tier = 5;
  repeated SalvageResult preview = 6;
}

message SalvageItemRequest {
  int32 character_id = 1;
  int32 item_id = 2;
}

message SalvageItemResponse {
  bool success = 1;
  string message = 2;
  repeated SalvageResult results = 3;
}

message SalvageResult {
  string resource_type = 1;
  int32 amount = 2;
}
